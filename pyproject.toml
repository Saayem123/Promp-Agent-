[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-agent"
version = "0.1.0"
description = "Compile human WhatsApp and voice prompts from saved nuances, a brief, and real transcripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML"]

[project.scripts]
prompt-agent = "prompt_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
